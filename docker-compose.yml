services:
  # --- Relational Sources ---
  postgres-source:
    image: postgres:15
    container_name: postgres-source
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
      POSTGRES_DB: ${POSTGRES_DB:-transactional_db}
    ports:
      - "5432:5432"
    volumes:
      - ./databases/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d transactional_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-platform-net

  mysql-source:
    image: mysql:8.0
    container_name: mysql-source
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-billing_db}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin_password}
    ports:
      - "3306:3306"
    volumes:
      - ./databases/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-platform-net

  # --- NoSQL Sources ---
  mongodb-source:
    image: mongo:6.0
    container_name: mongodb-source
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin_password}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-catalog_db}
    ports:
      - "27017:27017"
    volumes:
      - ./databases/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-platform-net

  cassandra-source:
    image: cassandra:4.1
    container_name: cassandra-source
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: "EventCluster"
    ports:
      - "9042:9042"
    volumes:
      - ./databases/cassandra:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - data-platform-net

  # --- Ingestion ---
  nifi:
    image: apache/nifi:1.23.2
    container_name: nifi
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_USER:-admin}
      - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_PASSWORD:-admin_password_123}
    healthcheck:
      test: ["CMD", "curl", "-k", "--fail", "https://localhost:8443/nifi"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2g
    networks:
      - data-platform-net

  # --- Orchestration ---
  airflow-db:
    image: postgres:15
    container_name: airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-platform-net

  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.9.0}
    container_name: airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _PIP_ADDITIONAL_DEPENDENCIES: 'apache-airflow-providers-apache-spark pyspark==3.4.1 delta-spark==2.4.0 great-expectations==0.18.0 loguru pyyaml google-cloud-storage boto3 azure-storage-blob'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark:/opt/airflow/spark
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./data_quality:/opt/airflow/data_quality
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-db:
        condition: service_healthy
    networks:
      - data-platform-net

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.9.0}
    container_name: airflow-scheduler
    restart: unless-stopped
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _PIP_ADDITIONAL_DEPENDENCIES: 'apache-airflow-providers-apache-spark pyspark==3.4.1 delta-spark==2.4.0 great-expectations==0.18.0 loguru pyyaml google-cloud-storage boto3 azure-storage-blob'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark:/opt/airflow/spark
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./data_quality:/opt/airflow/data_quality
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob']
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-db:
        condition: service_healthy
    networks:
      - data-platform-net

  # --- Processing ---
  spark-master:
    build:
      context: ./docker/spark
    container_name: spark-master
    restart: unless-stopped
    user: root
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8081:8081"
    volumes:
      - ./spark:/opt/bitnami/spark/spark-apps
      - ./data:/opt/bitnami/spark/data
      - ./config:/opt/bitnami/spark/config
      - ./data_quality:/opt/bitnami/spark/data_quality
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2g
    networks:
      - data-platform-net

  spark-worker:
    build:
      context: ./docker/spark
    container_name: spark-worker
    restart: unless-stopped
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./spark:/opt/bitnami/spark/spark-apps
      - ./data:/opt/bitnami/spark/data
      - ./config:/opt/bitnami/spark/config
      - ./data_quality:/opt/bitnami/spark/data_quality
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2g
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - data-platform-net

networks:
  data-platform-net:
    name: data-platform-network
