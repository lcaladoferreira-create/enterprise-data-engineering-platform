[tool.poetry]
name = "multi-cloud-data-engineering-platform"
version = "0.1.0"
description = "Production-grade Data Engineering platform with multi-cloud support"
authors = ["Senior Data Engineer <senior.de@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
apache-airflow = "2.9.0"
pyspark = "3.4.1"
great-expectations = "0.18.0"
delta-spark = "2.4.0"
boto3 = "^1.28.0"
google-cloud-storage = "^2.10.0"
azure-storage-blob = "^12.17.0"
loguru = "^0.7.0"
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-spark = "^0.6.0"
ruff = "^0.0.285"
black = "^23.7.0"
mypy = "^1.5.1"
bandit = "^1.7.5"
pre-commit = "^3.3.3"
detect-secrets = "^1.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
