global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow-webserver:9102']

  - job_name: 'spark'
    static_configs:
      - targets: ['spark-master:4040']

  - job_name: 'nifi'
    metrics_path: '/nifi-api/metrics'
    scheme: 'https'
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['nifi:8443']
