name: Enterprise Data Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-validation:
    name: Python Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyspark flake8

      - name: Lint (Ruff)
        run: ruff check .

      - name: Lint (Flake8)
        run: flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Compile
        run: python -m compileall dags spark scripts tests

      - name: Unit Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/

  infrastructure-validation:
    name: Terraform Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Format Check
        run: terraform fmt -check -recursive infrastructure

  orchestration-validation:
    name: Docker Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Config Check
        run: docker compose config

      - name: Build Check
        run: docker compose build
