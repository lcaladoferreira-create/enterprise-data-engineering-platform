name: Enterprise Data Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-validation:
    name: Python Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Set up Java (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyspark pyyaml google-cloud-storage pandas pyarrow

      - name: Lint (Ruff)
        run: ruff check .

      - name: Compile
        run: python -m compileall dags spark scripts tests

      - name: Unit Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/

  infrastructure-validation:
    name: Terraform Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format Check
        run: terraform fmt -check -recursive infrastructure

  orchestration-validation:
    name: Docker Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Config Check
        run: docker compose config
