entities:
  customers:
    pk: customer_id
    pii:
      - email
      - phone
      - address
    critical:
      - email
  orders:
    pk: order_id
    watermark_col: order_date
    critical:
      - customer_id
      - total_amount
  products:
    pk: product_id
    critical:
      - name
      - price
  order_items:
    pk: order_item_id
    critical:
      - order_id
      - product_id
  payments:
    pk: payment_id
    watermark_col: payment_date
    critical:
      - invoice_id
      - amount
  invoices:
    pk: invoice_id
    watermark_col: invoice_date
    critical:
      - order_id
